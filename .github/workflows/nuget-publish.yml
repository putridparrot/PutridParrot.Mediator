name: Build and Publish NuGet Packages

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SOLUTION: PutridParrot.Mediator.slnx
  CONFIGURATION: Release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for GitVersion
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # Both SDKs, so the library and tests are built and run for net8.0 and net10.0
        dotnet-version: |
          8.0.x
          10.0.x
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}
    
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore
    
    - name: Run tests
      run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal --logger trx --results-directory "TestResults"

    # Proves the generated, reflection-free path works as a real Native AOT executable;
    # the smoke test exits with a non-zero code if any check fails
    - name: Install Native AOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Native AOT smoke test
      run: |
        dotnet publish PutridParrot.Mediator.AotSmokeTest/PutridParrot.Mediator.AotSmokeTest.csproj --configuration ${{ env.CONFIGURATION }} --output aot-smoke
        ./aot-smoke/PutridParrot.Mediator.AotSmokeTest

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/*.trx

  pack-and-publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # Both SDKs, so the library and tests are built and run for net8.0 and net10.0
        dotnet-version: |
          8.0.x
          10.0.x
    
    - name: Determine version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_RELEASE=true" >> $GITHUB_OUTPUT
        else
          # For non-tagged builds, use version from project with build number suffix
          VERSION="1.0.0-preview.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_RELEASE=false" >> $GITHUB_OUTPUT
        fi
        echo "Building version: $VERSION"
    
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}
    
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore /p:Version=${{ steps.version.outputs.VERSION }}
    
    - name: Pack PutridParrot.Mediator
      run: dotnet pack PutridParrot.Mediator/PutridParrot.Mediator.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output ./artifacts /p:PackageVersion=${{ steps.version.outputs.VERSION }}
    
    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg
    
    - name: Publish to NuGet (Release)
      if: steps.version.outputs.IS_RELEASE == 'true'
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
    
    - name: Publish to NuGet (Preview)
      if: steps.version.outputs.IS_RELEASE == 'false'
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
    
    - name: Create GitHub Release
      if: steps.version.outputs.IS_RELEASE == 'true'
      uses: softprops/action-gh-release@v1
      with:
        files: ./artifacts/*.nupkg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
